name: Build Calculator.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name Calculator src/Calculator.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-exe
          path: dist/Calculator.exe
